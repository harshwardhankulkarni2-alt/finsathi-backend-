# Render Blueprint: creates the API + a Postgres database in one go.
services:
  - type: web
    name: finsathi-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: finsathi-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://finsathi.vercel.app

databases:
  - name: finsathi-db
    plan: free
